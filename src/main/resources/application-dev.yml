spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://<SUPABASE_HOST>:5432/postgres}
    username: ${DB_USER:<SUPABASE_USER>}
    password: ${DB_PASSWORD:<SUPABASE_PASSWORD>}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN