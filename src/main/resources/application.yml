spring:
  profiles:
    default: local
  application:
    name: backend-thanos
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  server:
    port: 8080

  logging:
    level:
      org.springframework.web: INFO
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}