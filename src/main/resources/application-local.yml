spring:
  datasource:
    url: jdbc:postgresql://<SUPABASE_HOST>:5432/postgres
    username: <SUPABASE_USER>
    password: <SUPABASE_PASSWORD>
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect